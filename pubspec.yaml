name: ecommerce2
description: "A modern, scalable Flutter E-Commerce mobile application showcasing clean architecture and software engineering best practices."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "images/applogo.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - images/advertisement.png
    - images/shoes.png
    - images/headphone.png
    - images/smartphone.png
    - images/smartwatch.png
    - images/applogo.jpg
